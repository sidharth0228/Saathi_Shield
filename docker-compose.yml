version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: saathi_db
    environment:
      - POSTGRES_DB=saathi_shield
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: saathi_redis
    ports:
      - "6379:6379"

  web:
    build: ./backend
    container_name: saathi_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-saathi-shield-development-key-123456789
      - USE_SQLITE=False
      - DB_NAME=saathi_shield
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - GOOGLE_OAUTH_CLIENT_ID=mock-google-client-id
      - TWILIO_ACCOUNT_SID=mock_sid
      - TWILIO_AUTH_TOKEN=mock_token
      - TWILIO_PHONE_NUMBER=+1234567890
    depends_on:
      - db
      - redis

  celery:
    build: ./backend
    container_name: saathi_celery
    command: celery -A saathi_shield worker -l info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-saathi-shield-development-key-123456789
      - USE_SQLITE=False
      - DB_NAME=saathi_shield
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery-beat:
    build: ./backend
    container_name: saathi_celery_beat
    command: celery -A saathi_shield beat -l info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-saathi-shield-development-key-123456789
      - USE_SQLITE=False
      - DB_NAME=saathi_shield
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  pgdata:
